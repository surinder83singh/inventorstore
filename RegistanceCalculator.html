<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Resistor Calculator - Compact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; overflow-x: hidden; }
        .resistor-body {
            background: #d4b483;
            height: 40px;
            width: 150px;
            border-radius: 15px;
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.1);
        }
        .resistor-body::after,
        .resistor-body::before{
            content: "";
            position: absolute;
            top: 0%;
            left: 50%;
            height: 5px;
            width: 62%;
            transform: translate(-50%, 0%);
            border: 2px solid rgb(15 23 42 / var(--tw-bg-opacity, 1));
            border-width: 0px 5px;
            --tw-bg-opacity: 1;
            background-color: rgb(15 23 42 / var(--tw-bg-opacity, 1));
        }
        .resistor-body::before{
            top: unset;
            bottom: 0%;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        .resistor-body::after{
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
        }
        .resistor-wire {
            width: 200px;
            height: 4px;
            background:#C0C0C0;/* #f9f9f9;*/
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 2px;
        }
        .resistor-wire::after,
        .resistor-wire::before{
            content: "";
            position: absolute;
            top: 0%;
            left: 0%;
            width: 4px;
            height: 25px;
            background: #C0C0C0;
            border-radius: 5px;
        }
        .resistor-wire::before{
            right: 0%;
            left: unset;
        }
        .band-visual {
            width: 10px;
            height: 100%;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }
        /* Color Classes */
        .bg-black { background-color: #000000; }
        .bg-brown { background-color: #8B4513; }
        .bg-red { background-color: #EF4444; }
        .bg-orange { background-color: #F97316; }
        .bg-yellow { background-color: #FACC15; }
        .bg-green { background-color: #22C55E; }
        .bg-blue { background-color: #3B82F6; }
        .bg-violet { background-color: #8B5CF6; }
        .bg-grey { background-color: #6B7280; }
        .bg-white { background-color: #FFFFFF; border: 1px solid #e2e8f0; }
        .bg-gold { background-color: #FFD700; }
        .bg-silver { background-color: #C0C0C0; }

        input[type="radio"]:checked + label {
            ring: 2px;
            ring-offset: 1px;
            --tw-ring-color: #3b82f6;
            transform: scale(1.35);
            z-index: 10;
        }
        .hide-band { display: none !important; }
        .grid-cols-2-min-w{
            grid-template-columns: repeat(2, minmax(450px, 1fr));
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-2">

    <div class="w-full1 max-w-8md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200 flex flex-col max-h-[95vh]">
        
        <div class="bg-slate-900 px-6 py-4 flex flex-wrap items-center justify-between align-items text-white shrink-0">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight leading-none">Resistor Calculator</h1>
                <div class="flex gap-2 mt-2">
                    <button onclick="setMode(4)" id="btn-4" class="mode-btn px-3 py-1 text-xs rounded-full bg-blue-600 font-bold transition-all">4-Band</button>
                    <button onclick="setMode(5)" id="btn-5" class="mode-btn px-3 py-1 text-xs rounded-full bg-slate-700 font-bold transition-all">5-Band</button>
                    <button onclick="setMode(6)" id="btn-6" class="mode-btn px-3 py-1 text-xs rounded-full bg-slate-700 font-bold transition-all">6-Band</button>
                </div>
            </div>

            <div class="relative hidden items-center justify-center px-8 sm:flex">
                <div class="resistor-wire"></div>
                <div class="resistor-body">
                    <div id="v-band1" class="band-visual bg-brown"></div>
                    <div id="v-band2" class="band-visual bg-black"></div>
                    <div id="v-band3" class="band-visual bg-black hide-band"></div>
                    <div id="v-band4" class="band-visual bg-red"></div>
                    <div class="w-4"></div> <!-- Gap for visual separation -->
                    <div id="v-band5" class="band-visual bg-gold"></div>
                    <div id="v-band6" class="band-visual bg-brown hide-band"></div>
                </div>
            </div>

            <div class="text-right min-w-[150px]">
                <div id="res-value" class="text-3xl font-black text-blue-400">1.00 kΩ</div>
                <div id="tol-value" class="text-xs font-semibold text-slate-400">± 5%</div>
            </div>
        </div>

        <div class="flex-1 overflow-auto flex flex-row flex-wrap">
            <!-- Left: Controls (Scrollable if needed, but designed for 1 column) -->
            <div class="flex-[5] grow-[5] min-w-[300px] p-4 grid grid-cols-1 gap-x-6 gap-y-3 overflow-y-auto border-r border-slate-100">
                
                <section id="sec-b1">
                    <h3 class="text-[13px] font-bold text-slate-400 uppercase mb-1">1st Digit</h3>
                    <div class="flex flex-wrap gap-2 text-[14px] font-bold" id="group-b1"></div>
                </section>

                <section id="sec-b2">
                    <h3 class="text-[13px] font-bold text-slate-400 uppercase mb-1">2nd Digit</h3>
                    <div class="flex flex-wrap gap-2 text-[14px] font-bold" id="group-b2"></div>
                </section>

                <section id="sec-b3" class="hide-band">
                    <h3 class="text-[13px] font-bold text-slate-400 uppercase mb-1">3rd Digit</h3>
                    <div class="flex flex-wrap gap-2 text-[14px] font-bold" id="group-b3"></div>
                </section>

                <section id="sec-mult">
                    <h3 class="text-[13px] font-bold text-slate-400 uppercase mb-1">Multiplier ( x )</h3>
                    <div class="flex flex-wrap gap-2 text-[14px] font-bold" id="group-mult"></div>
                </section>

                <section id="sec-tol">
                    <h3 class="text-[13px] font-bold text-slate-400 uppercase mb-1">Tolerance ( % )</h3>
                    <div class="flex flex-wrap gap-2 text-[12px] font-bold" id="group-tol"></div>
                </section>

                <section id="sec-ppm" class="hide-band">
                    <h3 class="text-[13px] font-bold text-slate-400 uppercase mb-1">Temp Coeff (PPM)</h3>
                    <div class="flex flex-wrap gap-2 text-[12px] font-bold" id="group-ppm"></div>
                </section>
            </div>

            <div class="flex-1 bg-slate-50 p-6 flex flex-col min-w-[180px]">
                <div>
                    <span class="text-[13px] uppercase font-bold text-slate-400">Operating Range</span>
                    <div class="mt-2 space-y-2">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-slate-500">Minimum:</span>
                            <span id="min-res" class="font-bold text-slate-800">-</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-slate-500">Maximum:</span>
                            <span id="max-res" class="font-bold text-slate-800">-</span>
                        </div>
                    </div>
                </div>

                <div id="ppm-box" class="pt-4 border-t border-slate-200 hide-band">
                    <span class="text-[13px] uppercase font-bold text-slate-400">Temperature Coefficient</span>
                    <div id="ppm-val" class="text-sm font-bold text-orange-600 mt-1">100 ppm/K</div>
                </div>

                <div class="pt-2 border-t border-slate-200 mt-auto">
                    <!-- <div class="h-1.5 w-full bg-slate-200 rounded-full relative overflow-hidden">
                        <div class="absolute inset-y-0 left-0 bg-blue-500 w-full opacity-10"></div>
                        <div class="absolute inset-y-0 left-1/4 right-1/4 bg-blue-600 rounded-full"></div>
                    </div> -->
                    <p class="text-[10px] text-slate-400 mt-2 leading-tight">Calculated based on standard electronic color code values (IEC 60062).</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const colors = [
            { name: 'Black', val: 0, mult: 1, tol: null, ppm: 250, hex: 'bg-black', text: 'text-white' },
            { name: 'Brown', val: 1, mult: 10, tol: 1, ppm: 100, hex: 'bg-brown', text: 'text-white' },
            { name: 'Red', val: 2, mult: 100, tol: 2, ppm: 50, hex: 'bg-red', text: 'text-white' },
            { name: 'Orange', val: 3, mult: 1000, tol: null, ppm: 15, hex: 'bg-orange', text: 'text-white' },
            { name: 'Yellow', val: 4, mult: 10000, tol: null, ppm: 25, hex: 'bg-yellow', text: 'text-black' },
            { name: 'Green', val: 5, mult: 100000, tol: 0.5, ppm: 20, hex: 'bg-green', text: 'text-white' },
            { name: 'Blue', val: 6, mult: 1000000, tol: 0.25, ppm: 10, hex: 'bg-blue', text: 'text-white' },
            { name: 'Violet', val: 7, mult: 10000000, tol: 0.1, ppm: 5, hex: 'bg-violet', text: 'text-white' },
            { name: 'Grey', val: 8, mult: null, tol: 0.05, ppm: 1, hex: 'bg-grey', text: 'text-white' },
            { name: 'White', val: 9, mult: null, tol: null, ppm: null, hex: 'bg-white', text: 'text-black' },
            { name: 'Gold', val: null, mult: 0.1, tol: 5, ppm: null, hex: 'bg-gold', text: 'text-black' },
            { name: 'Silver', val: null, mult: 0.01, tol: 10, ppm: null, hex: 'bg-silver', text: 'text-black' }
        ];

        let currentMode = 4; // Default to 4-band

        function setMode(mode) {
            currentMode = mode;
            // Update Buttons
            document.querySelectorAll('.mode-btn').forEach(b => b.className = 'mode-btn px-3 py-1 text-xs rounded-full bg-slate-700 font-bold transition-all');
            document.getElementById(`btn-${mode}`).className = 'mode-btn px-3 py-1 text-xs rounded-full bg-blue-600 font-bold transition-all text-white';

            // Toggle Visibility
            document.getElementById('sec-b3').classList.toggle('hide-band', mode === 4);
            document.getElementById('sec-ppm').classList.toggle('hide-band', mode !== 6);
            document.getElementById('ppm-box').classList.toggle('hide-band', mode !== 6);
            
            document.getElementById('v-band3').classList.toggle('hide-band', mode === 4);
            document.getElementById('v-band6').classList.toggle('hide-band', mode !== 6);

            update();
        }

        function initInputs() {
            const containers = {
                b1: document.getElementById('group-b1'),
                b2: document.getElementById('group-b2'),
                b3: document.getElementById('group-b3'),
                mult: document.getElementById('group-mult'),
                tol: document.getElementById('group-tol'),
                ppm: document.getElementById('group-ppm')
            };

            colors.forEach((c, idx) => {
                if (c.val !== null) {
                    containers.b1.innerHTML += createRadio('b1', idx, c, idx === 1);
                    containers.b2.innerHTML += createRadio('b2', idx, c, idx === 0);
                    containers.b3.innerHTML += createRadio('b3', idx, c, idx === 0);
                }
                if (c.mult !== null) containers.mult.innerHTML += createRadio('mult', idx, c, c.name === 'Red');
                if (c.tol !== null) containers.tol.innerHTML += createRadio('tol', idx, c, c.name === 'Gold');
                if (c.ppm !== null) containers.ppm.innerHTML += createRadio('ppm', idx, c, c.name === 'Brown');
            });
        }

        function createRadio(group, id, color, checked) {
            const labelContent = group === 'mult' ? formatNumber(color.mult) : (group === 'tol' ? color.tol : (group === 'ppm' ? color.ppm : color.val));
            return `
                <div class="relative">
                    <input type="radio" name="${group}" title="${color.name}" id="${group}-${id}" value="${id}" class="hidden" ${checked ? 'checked' : ''} onchange="update()">
                    <label for="${group}-${id}" title="${color.name}" class="flex items-center justify-center w-10 h-10 rounded cursor-pointer border shadow-md transition-all ${color.hex} ${color.text}">
                        ${labelContent}
                    </label>
                </div>
            `;
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000) + 'M';
            if (num >= 1000) return (num / 1000) + 'k';
            return num;
        }

        function formatOhms(num) {
            if (num >= 1000000) return (num / 1000000).toLocaleString(undefined, {maximumFractionDigits: 2}) + " MΩ";
            if (num >= 1000) return (num / 1000).toLocaleString(undefined, {maximumFractionDigits: 2}) + " kΩ";
            return num.toLocaleString(undefined, {maximumFractionDigits: 2}) + " Ω";
        }

        function update() {
            const b1 = colors[document.querySelector('input[name="b1"]:checked').value];
            const b2 = colors[document.querySelector('input[name="b2"]:checked').value];
            const b3 = colors[document.querySelector('input[name="b3"]:checked').value];
            const mult = colors[document.querySelector('input[name="mult"]:checked').value];
            const tol = colors[document.querySelector('input[name="tol"]:checked').value];
            const ppm = colors[document.querySelector('input[name="ppm"]:checked').value];

            // Visual Update
            document.getElementById('v-band1').className = `band-visual ${b1.hex}`;
            document.getElementById('v-band2').className = `band-visual ${b2.hex}`;
            document.getElementById('v-band3').className = `band-visual ${b3.hex} ${currentMode === 4 ? 'hide-band' : ''}`;
            document.getElementById('v-band4').className = `band-visual ${mult.hex}`;
            document.getElementById('v-band5').className = `band-visual ${tol.hex}`;
            document.getElementById('v-band6').className = `band-visual ${ppm.hex} ${currentMode !== 6 ? 'hide-band' : ''}`;

            // Math
            let base;
            if (currentMode === 4) {
                base = (b1.val * 10) + b2.val;
            } else {
                base = (b1.val * 100) + (b2.val * 10) + b3.val;
            }

            const resistance = base * mult.mult;
            const tPct = tol.tol;
            const min = resistance * (1 - (tPct / 100));
            const max = resistance * (1 + (tPct / 100));

            // Display
            document.getElementById('res-value').innerText = formatOhms(resistance);
            document.getElementById('tol-value').innerText = `± ${tPct}%`;
            document.getElementById('min-res').innerText = formatOhms(min);
            document.getElementById('max-res').innerText = formatOhms(max);
            
            if (currentMode === 6) {
                document.getElementById('ppm-val').innerText = `${ppm.ppm} ppm/K`;
            }
        }

        window.onload = () => {
            initInputs();
            setMode(4);
        };
    </script>
</body>
</html>
